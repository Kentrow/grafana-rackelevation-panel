name: Bug report
description: The panel draws something wrong, shows a wrong problem, or does not react as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report it. The data the panel receives is the most useful part: with it, the
        drawing can be reproduced exactly.
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
      description: A screenshot of the panel helps.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data received by the panel
      description: |
        In the panel editor, open **Query inspector > Data**, pick each frame, and paste it as CSV (**Download CSV**,
        or copy the table). A few rows that show the problem are enough; replace names you cannot share.
      render: csv
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Panel options
      description: The options you changed, or the panel JSON (**More > Inspect > Panel JSON**).
      render: json
  - type: input
    id: grafana
    attributes:
      label: Grafana version
      placeholder: 13.3.1
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox 150, Chrome 159...
